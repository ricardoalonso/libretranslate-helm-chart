name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          skip_existing: true
          mark_as_latest: true
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  # Pre-bump the patch version on main so the next push publishes a new version.
  # Runs only after a successful release, so a failed publish does not burn a version.
  bump-version:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          command -v yq >/dev/null || {
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }

      - name: Bump Patch Version
        run: |
          # Read the current version
          version=$(yq e '.version' charts/libretranslate/Chart.yaml)

          # Split the version into major, minor, and patch
          IFS='.' read -ra VERSION_PARTS <<< "$version"

          # Increment the patch version
          VERSION_PARTS[2]=$((VERSION_PARTS[2] + 1))

          # Reassemble the version string
          new_version="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.${VERSION_PARTS[2]}"

          # Update the version in the Chart.yaml file
          yq e ".version = \"$new_version\"" -i charts/libretranslate/Chart.yaml

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add charts/libretranslate/Chart.yaml
          git commit -m "Bump chart version [skip ci]"
          git push
