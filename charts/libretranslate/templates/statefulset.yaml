apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "libretranslate.fullname" . }}
  labels:
    {{- include "libretranslate.labels" . | nindent 4 }}
  {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "libretranslate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "libretranslate.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}
      # off OpenShift this forces the volumes to be mounted as the libretranslate
      # group; on OpenShift the SCC assigns fsGroup itself and this only carries
      # the seccompProfile that `restricted-v2` requires
      securityContext:
        {{- include "libretranslate.podSecurityContext" . | nindent 8 }}
      {{- if .Values.persistence.enabled }}
      initContainers:
        - name: volume-permissions-and-pre-install-models
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
          - /bin/bash
          - -c
          - |
            mkdir -p {{ include "libretranslate.modelsPath" . }}/packages
            {{- if not (include "libretranslate.isOpenShift" .) }}
            chown -R {{ .Values.podSecurityContext.runAsUser | default 1032 }}:{{ .Values.podSecurityContext.runAsGroup | default 1032 }} {{ include "libretranslate.homeDir" . }}/.local {{ .Values.appConfig.apiKeysDbPathMount }}
            {{- end }}

            if [ ! "$(ls -A {{ include "libretranslate.modelsPath" . }}/packages)" ]; then
              echo "Installing models... this can take quite a while depending on your internet connection."
              /app/venv/bin/python /app/scripts/install_models.py --load_only_lang_codes {{ .Values.appConfig.loadOnly | quote }}
            else
              echo "The models directory is not empty, skipping model installation."
            fi
          env:
            {{- include "libretranslate.runtimeEnv" . | nindent 12 }}
          volumeMounts:
          - name: models-volume
            mountPath: {{ include "libretranslate.modelsPath" . }}
          - name: db-volume
            mountPath: {{ .Values.appConfig.apiKeysDbPathMount }}
          securityContext:
            {{- include "libretranslate.initContainerSecurityContext" . | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ include "libretranslate.appPort" . }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "libretranslate.containerSecurityContext" . | nindent 12 }}
          {{- with (include "libretranslate.probe" (dict "probe" .Values.startupProbe "root" $)) }}
          startupProbe:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with (include "libretranslate.probe" (dict "probe" .Values.readinessProbe "root" $)) }}
          readinessProbe:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with (include "libretranslate.probe" (dict "probe" .Values.livenessProbe "root" $)) }}
          livenessProbe:
            {{- . | nindent 12 }}
          {{- end }}
          env:
            {{- include "libretranslate.runtimeEnv" . | nindent 12 }}
            {{- if not (empty .Values.appSettings.debug) }}
            - name: LT_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: debug
            {{- end }}
            {{- if not (empty .Values.appSettings.ssl) }}
            - name: LT_SSL
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: ssl
            {{- end }}
            {{- if not (empty .Values.appSettings.apiKeys) }}
            - name: LT_API_KEYS
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: apiKeys
            {{- end }}
            {{- if not (empty .Values.appSettings.requireApiKeyOrigin) }}
            - name: LT_REQUIRE_API_KEY_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: requireApiKeyOrigin
            {{- end }}
            {{- if not (empty .Values.appSettings.requireApiKeySecret) }}
            - name: LT_REQUIRE_API_KEY_SECRET
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: requireApiKeySecret
            {{- end }}
            {{- if not (empty .Values.appSettings.suggestions) }}
            - name: LT_SUGGESTIONS
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: suggestions
            {{- end }}
            {{- if not (empty .Values.appSettings.disableFilesTranslation) }}
            - name: LT_DISABLE_FILES_TRANSLATION
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: disableFilesTranslation
            {{- end }}
            {{- if not (empty .Values.appSettings.disableWebUi) }}
            - name: LT_DISABLE_WEB_UI
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: disableWebUi
            {{- end }}
            {{- if not (empty .Values.appSettings.updateModels) }}
            - name: LT_UPDATE_MODELS
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: updateModels
            {{- end }}
            {{- if not (empty .Values.appSettings.metrics) }}
            - name: LT_METRICS
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-appsettings
                  key: metrics
            {{- end }}
            {{- if not (empty .Values.appConfig.host) }}
            - name: LT_HOST
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: host
            {{- end }}
            {{- if not (empty .Values.appConfig.port) }}
            - name: LT_PORT
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: port
            {{- end }}
            {{- if not (empty .Values.appConfig.charLimit) }}
            - name: LT_CHAR_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: charLimit
            {{- end }}
            {{- if not (empty .Values.appConfig.reqLimit) }}
            - name: LT_REQ_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: reqLimit
            {{- end }}
            {{- if not (empty .Values.appConfig.reqLimitStorage) }}
            - name: LT_REQ_LIMIT_STORAGE
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: reqLimitStorage
            {{- end }}
            {{- if not (empty .Values.appConfig.batchLimit) }}
            - name: LT_BATCH_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: batchLimit
            {{- end }}
            {{- if not (empty .Values.appConfig.gaId) }}
            - name: LT_GA_ID
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: gaId
            {{- end }}
            {{- if not (empty .Values.appConfig.frontendLanguageSource) }}
            - name: LT_FRONTEND_LANGUAGE_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: frontendLanguageSource
            {{- end }}
            {{- if not (empty .Values.appConfig.frontendLanguageTarget) }}
            - name: LT_FRONTEND_LANGUAGE_TARGET
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: frontendLanguageTarget
            {{- end }}
            {{- if not (empty .Values.appConfig.frontendTimeout) }}
            - name: LT_FRONTEND_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: frontendTimeout
            {{- end }}
            {{- if not (empty .Values.appConfig.apiKeysDbPath) }}
            - name: LT_API_KEYS_DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: apiKeysDbPath
            {{- end }}
            {{- if not (empty .Values.appConfig.apiKeysRemote) }}
            - name: LT_API_KEYS_REMOTE
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: apiKeysRemote
            {{- end }}
            {{- if not (empty .Values.appConfig.getApiKeyLink) }}
            - name: LT_GET_API_KEY_LINK
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: getApiKeyLink
            {{- end }}
            {{- if not (empty .Values.appConfig.sharedStorage) }}
            - name: LT_SHARED_STORAGE
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: sharedStorage
            {{- end }}
            {{- if not (empty .Values.appConfig.loadOnly) }}
            - name: LT_LOAD_ONLY
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: loadOnly
            {{- end }}
            {{- if not (empty .Values.appConfig.threads) }}
            - name: LT_THREADS
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: threads
            {{- end }}
            {{- if not (empty .Values.appConfig.metricsAuthToken) }}
            - name: LT_METRICS_AUTH_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: metricsAuthToken
            {{- end }}
            {{- if not (empty .Values.appConfig.urlPrefix) }}
            - name: LT_URL_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: libretranslate-config
                  key: urlPrefix
            {{- end }}
          {{- if or .Values.persistence.enabled (include "libretranslate.isOpenShift" .) }}
          volumeMounts:
          - name: db-volume
            mountPath: {{ .Values.appConfig.apiKeysDbPathMount }}
          - name: models-volume
            mountPath: {{ include "libretranslate.modelsPath" . }}
          {{- end }}
      {{- if and .Values.persistence.enabled (or (eq .Values.persistence.models.accessMode "ReadWriteMany") (eq .Values.persistence.db.accessMode "ReadWriteMany")) }}
      volumes:
      {{- if eq .Values.persistence.db.accessMode "ReadWriteMany" }}
      - name: db-volume
        persistentVolumeClaim:
          claimName: db-volume
      {{- end }}
      {{- if eq .Values.persistence.models.accessMode "ReadWriteMany" }}
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-volume
      {{- end }}
      {{- else if and (include "libretranslate.isOpenShift" .) (not .Values.persistence.enabled) }}
      # the pod runs as an arbitrary UID that cannot write to the image-owned
      # model and database directories; emptyDir volumes inherit the
      # SCC-assigned fsGroup and are therefore writable
      volumes:
      - name: models-volume
        emptyDir: {}
      - name: db-volume
        emptyDir: {}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
      {{- toYaml .Values.tolerations   | nindent 6 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (or (eq .Values.persistence.models.accessMode "ReadWriteOnce") (eq .Values.persistence.db.accessMode "ReadWriteOnce")) }}
  # still in beta, but this will allow us to delete the volumes when the statefulset is scaled down
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Delete
  volumeClaimTemplates:
  {{- if eq .Values.persistence.models.accessMode "ReadWriteOnce" }}
  - metadata:
      name: models-volume
      labels:
        {{- include "libretranslate.pvcLabels" . | nindent 8 }}
    spec:
      accessModes:
        - {{ .Values.persistence.models.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.models.size }}
      {{- if .Values.persistence.models.storageClass }}
      storageClassName: {{ .Values.persistence.models.storageClass | quote }}
      {{- end }}
  {{- end }}
  {{- if eq .Values.persistence.db.accessMode "ReadWriteOnce" }}
  - metadata:
      name: db-volume
      labels:
        {{- include "libretranslate.pvcLabels" . | nindent 8 }}
    spec:
      accessModes:
        - {{ .Values.persistence.db.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.db.size }}
      {{- if .Values.persistence.db.storageClass }}
      storageClassName: {{ .Values.persistence.db.storageClass | quote }}
      {{- end }}
  {{- end }}
  {{- end }}