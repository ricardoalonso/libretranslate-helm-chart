# values.yaml

# Number of replicas
replicaCount: 1

# Extra annotations for pods
podAnnotations: {}

# Extra annotations
annotations: {}

# Extra tolerations for pods
tolerations: []

# Chart name override
nameOverride: ""

# Full name of the deployment to override the default one
fullnameOverride: ""

# Image settings
image:
  repository: libretranslate/libretranslate
  pullPolicy: Always
  tag: "latest"
# Using a Private Registry
# If you want to use a custom image from a private registry, you'll need to create an image pull secret with the registry's credentials:
# kubectl create secret docker-registry my-registry-secret --docker-server=DOCKER_REGISTRY_SERVER --docker-username=DOCKER_USER --docker-password=DOCKER_PASSWORD --docker-email=DOCKER_EMAIL
# imagePullSecrets:
#   - name: my-registry-secret
imagePullSecrets: []

# Service settings
#
# `port` is the port the Service itself listens on. It is independent of the
# port LibreTranslate binds inside the pod, which is `appConfig.port` below -
# the Service targets that one by name, so the two are free to differ.
service:
  type: ClusterIP
  port: 5000

# Ingress settings
#
# The service can be exposed either with a Kubernetes Ingress or with an
# OpenShift Route. `kind` picks which one:
#   auto    - Route on OpenShift/OKD, Ingress on vanilla Kubernetes (default,
#             follows the same detection as `openshift.enabled` below)
#   ingress - always a networking.k8s.io/v1 Ingress. Works on OpenShift too,
#             which turns it into a Route for you.
#   route   - always a route.openshift.io/v1 Route. Rejected on vanilla
#             Kubernetes, which has no such API; when rendering Routes offline
#             with `helm template`, force detection with openshift.enabled=true.
ingress:
  enabled: false
  kind: auto
  className: ""  # set this to the name of the ingress controller class to use like nginx. Ignored by Routes.
  annotations:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    # Check for the adminUser key below.
    # This will enable basic auth for the whole site.
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: libretranslate-auth
    # nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
  hosts:
    - host: translate.example.com
      paths:
      - path: /
        pathType: Prefix

  # HTTPS certificates. One entry per certificate; its `hosts` list says which
  # of the hosts above it serves, and an entry without `hosts` serves all of
  # them. Leave the list empty to be served over plain HTTP.
  #
  # Either reference a TLS secret you created yourself
  #
  #     kubectl create secret tls libretranslate-secret-tls --cert=tls.crt --key=tls.key
  #
  # or hand the PEM certificate and private key to the chart, which then creates
  # the secret for you (Ingress) or inlines them into the Route. `certificate`
  # should hold the full chain, leaf certificate first; `caCertificate` is
  # optional and only for a chain the clients would not otherwise trust.
  #
  # Keys are secrets: prefer `--set-file` over committing them to a values file,
  #
  #     helm install ... --set-file ingress.tls[0].certificate=tls.crt \
  #                      --set-file ingress.tls[0].privateKey=tls.key
  tls: []
  # tls:
  #   - secretName: libretranslate-secret-tls
  #     hosts:
  #       - translate.example.com
  #   - hosts:
  #       - translate.example.com
  #     certificate: |
  #       -----BEGIN CERTIFICATE-----
  #       ...
  #       -----END CERTIFICATE-----
  #     privateKey: |
  #       -----BEGIN PRIVATE KEY-----
  #       ...
  #       -----END PRIVATE KEY-----
  #     caCertificate: |
  #       -----BEGIN CERTIFICATE-----
  #       ...
  #       -----END CERTIFICATE-----

  # Redirect plain http:// requests to https://. Needs a `tls` entry above -
  # without one there is nothing to redirect to and this is ignored.
  #
  # On a Route this is `spec.tls.insecureEdgeTerminationPolicy: Redirect`.
  # An Ingress has no portable field for it, so `redirectAnnotations` are merged
  # into the annotations above instead. They default to the ingress-nginx ones -
  # replace them for another controller (traefik, HAProxy, ...). Anything you set
  # in `annotations` wins over them, key by key.
  redirectHttpToHttps: false
  redirectAnnotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

  # OpenShift Route specifics. Ignored when an Ingress is rendered.
  # A Route holds one host and one path, so one Route is rendered per host/path
  # pair above: the first keeps the release name, the rest get a numeric suffix.
  route:
    # Where TLS is terminated:
    #   edge        - at the router, which talks plain HTTP to the pod (default)
    #   reencrypt   - at the router, which opens a new TLS connection to the pod;
    #                 needs appSettings.ssl=true and usually destinationCACertificate
    #   passthrough - not at all, the pod serves TLS itself (appSettings.ssl=true).
    #                 Routes cannot match a path in this mode, so `paths` above
    #                 is ignored and the whole host is routed.
    termination: edge
    # CA the router uses to verify the pod's own certificate. reencrypt only.
    destinationCACertificate: ""
    # What happens to plain http:// requests: None (refused), Redirect, or Allow
    # (served over http, edge/reencrypt only). Empty follows
    # redirectHttpToHttps: Redirect when it is true, None when it is false.
    insecureEdgeTerminationPolicy: ""
    wildcardPolicy: None
    # A `tls` entry with only a `secretName` and no inline certificate becomes
    # `spec.tls.externalCertificate`, which needs OpenShift 4.16+ with the
    # RouteExternalCertificate feature gate enabled and grants the router read
    # access to that secret. Inline certificate/privateKey work on every version.

# OpenShift / OKD compatibility
#
# OpenShift's default `restricted-v2` SCC assigns every pod an arbitrary UID and
# fsGroup out of the namespace's allocated range and rejects pods that pin their
# own IDs or run a container as root. Enabling this:
#   * drops runAsUser / runAsGroup / fsGroup from the security contexts below so
#     the SCC can assign them,
#   * runs the model pre-install init container as the pod user instead of root
#     and skips its chown (the SCC-assigned fsGroup already makes the mounted
#     volumes group writable),
#   * redirects the argos-translate cache and config directories out of $HOME,
#     which the image owns as UID 1032 with mode 0755 and an arbitrary UID
#     therefore cannot write to,
#   * backs the model and database directories with emptyDir volumes when
#     `persistence.enabled` is false, since an arbitrary UID cannot write to the
#     image-owned paths either.
# No SCC of your own is needed: the defaults below satisfy `restricted-v2`.
#
# Left unset, this is auto-detected from the presence of the
# `security.openshift.io/v1` API, so the chart adapts itself on OpenShift and on
# vanilla Kubernetes with no configuration. Set it to true or false only to force
# a mode - for instance when rendering manifests offline with `helm template`,
# which has no cluster to inspect and therefore assumes vanilla Kubernetes.
openshift:
  enabled:
  # XDG_CACHE_HOME and XDG_CONFIG_HOME for the pod. argos-translate creates both
  # under $HOME by default, which an arbitrary UID cannot write to; /tmp is mode
  # 1777 in the image, so any UID can. Note that language model archives are
  # downloaded into the cache dir, which on /tmp means node ephemeral storage -
  # point cacheDir at a mounted volume if that is a problem.
  cacheDir: /tmp/.cache
  configDir: /tmp/.config

# Home directory of the application user inside the container. Exported as HOME
# so that "~" resolves even when the pod runs under a UID that has no
# /etc/passwd entry, which is always the case on OpenShift.
homeDir: /home/libretranslate

# Pod level security context. Applies to every container in the pod and controls
# the ownership of the mounted volumes.
# On OpenShift (openshift.enabled=true) fsGroup, runAsUser and runAsGroup are
# dropped from this block and assigned by the SCC instead.
securityContext:
  fsGroup: 1032
  seccompProfile:
    type: RuntimeDefault

# Container level security context for the LibreTranslate container.
# On OpenShift (openshift.enabled=true) runAsUser and runAsGroup are dropped
# from this block and assigned by the SCC instead.
podSecurityContext:
  runAsUser: 1032
  runAsGroup: 1032
  # kept at container level, not pod level: the init container below runs as
  # root off OpenShift and a pod-wide runAsNonRoot would make the kubelet
  # refuse to start it
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Security context for the init container that fixes up volume permissions and
# pre-installs the language models. It needs root to chown the freshly
# provisioned volumes. Ignored when openshift.enabled=true, where the init
# container reuses podSecurityContext and the chown is skipped.
initContainerSecurityContext:
  runAsUser: 0
  runAsGroup: 0

# Persistent settings
# if you don't want to download a copy of the models per pod, you can use a shared storage like an nfs storage class
# and set it to ReadWriteMany. this way if you scale the pods later on, they will all use the same models and won't
# duplicate the space and download requests.
persistence:
  enabled: false
  db:
    storageClass: ""
    accessMode: "ReadWriteOnce"
    size: "1Gi"
  models:
    storageClass: ""
    accessMode: "ReadWriteOnce"
    size: "10Gi"  # as of August 2023, the models are about 6.6GB in size for all languages


# Resource limits
resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Probes
#
# All three poll LibreTranslate's /health endpoint over HTTP on the container
# port. The chart fills the handler in for you so that it follows
# `appConfig.port`, `appConfig.urlPrefix` and `appSettings.ssl` - what is
# configured below is the timing. Give a probe an `httpGet`, `exec` or
# `tcpSocket` block of its own to replace the handler, or empty it out
# (`livenessProbe:`) to drop that probe entirely.
#
# These used to exec `scripts/healthcheck.py`, which forks a CPython
# interpreter and imports `requests` on every check. That costs far more than
# the 1 second `timeoutSeconds` defaults to, so under a busy `resources.limits`
# the checks were timing out and being counted as failures.

# Covers the boot: the image downloads the sentence-boundary models and loads
# the language models before gunicorn binds, which on a cold cache takes
# minutes. The liveness and readiness probes do not run until this one passes,
# and a container still in its startup window is never restarted for failing
# it, so `failureThreshold` x `periodSeconds` is the boot budget - 10 minutes
# here. Raise it if you load a lot of languages onto slow storage.
startupProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

# Whether the pod is listed in the Service's endpoints and receives traffic.
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Restarts the container when it stops answering. Deliberately slacker than the
# readiness probe above: a pod tied up by a large batch translation should drop
# out of the Service and come back, not be killed and lose the work.
livenessProbe:
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

# Auth secret for basic authentication
# generate base64-user-password-pair with:
#   htpasswd -nb <username> <password> | base64
#
# e.g.:
#
#     htpasswd -nb admin mySecretPassword | base64
# This is used by the nginx ingress controller to enable basic auth for the whole site.
# It will create a secret with the name libretranslate-auth.
adminUser:
  name: "YWRtaW4K"  # copy the username in base64 as a reference
  auth: "YWRtaW46JGFwcjEkYlpydmYvUFYkSHBHSlhqZU1EN0ZON2kyYndsMVRNMQoK"  # copy the output from the htpasswd command here as a reference
  password: "bXlTZWNyZXRQYXNzd29yZAo="  # copy the password as base64 for the admin user here as a reference

# Settings / Flags
appSettings:
  debug:                 "false"    # Enable debug environment (Default: Disabled)
  ssl:                   "false"    # Enable SSL (Default: Disabled)
  apiKeys:               "false"    # Enable API keys database for per-client rate limits when --req-limit is reached (Default: Don't use API keys)
  requireApiKeyOrigin:   ""         # Require use of an API key for programmatic access to the API, unless the request origin matches this domain (Default: No restrictions on domain origin)
  requireApiKeySecret:   ""         # Require use of an API key for programmatic access to the API, unless the client also sends a secret match (Default: No secrets required)
  suggestions:           "false"    # Allow user suggestions (Default: Disabled)
  disableFilesTranslation: "false"  # Disable files translation (Default: File translation allowed)
  disableWebUi:          "false"    # Disable web ui (Default: Web Ui enabled)
  updateModels:          "false"    # Update language models at startup (Default: Only on if no models found)
  metrics:               "false"    # Enable the /metrics endpoint for exporting Prometheus usage metrics (Default: Disabled)

# Configuration Parameters
appConfig:
  host:                  "0.0.0.0"              # Set host to bind the server to (Default: 127.0.0.1)
  port:                  "5000"                 # Set port to bind the server to. Also the container port, which `service.port` targets by name (Default: 5000)
  charLimit:             "null"                 # Set character limit (Default: No limit)
  reqLimit:              "null"                 # Set maximum number of requests per minute per client (outside of limits set by api keys) (Default: No limit)
  reqLimitStorage:       "memory://"            # Storage URI to use for request limit data storage. See Flask Limiter (Default: memory://)
  batchLimit:            "null"                 # Set maximum number of texts to translate in a batch request (Default: No limit)
  gaId:                  ""                     # Enable Google Analytics on the API client page by providing an ID (Default: Empty (no tracking))
  frontendLanguageSource: "auto"                # Set frontend default language - source (Default: auto)
  frontendLanguageTarget: "locale"              # Set frontend default language - target (Default: locale (match site's locale))
  frontendTimeout:       "500"                  # Set frontend translation timeout (Default: 500)
  apiKeysDbPath:         "/app/db/api_keys.db"  # Use a specific path inside the container for the local database. Can be absolute or relative (Default: /app/db/api_keys.db)
  apiKeysDbPathMount:    "/app/db"              # Use a specific path inside the container for the local database. Must be the same as apiKeysDbPath (Default: /app/db)
  apiKeysRemote:         ""                     # Use this remote endpoint to query for valid API keys instead of using the local database (Default: Empty (use local db instead))
  getApiKeyLink:         ""                     # Show a link in the UI where to direct users to get an API key (Default: Empty (no link shown on web ui))
  sharedStorage:         "memory://"            # Shared storage URI to use for multi-process data sharing (e.g. when using gunicorn) (Default: memory://)
  loadOnly:              ""                     # Set available languages (Default: Empty (use all from argostranslate))
  threads:               "4"                    # Set number of threads (Default: 4)
  metricsAuthToken:      ""                     # Protect the /metrics endpoint by allowing only clients that have a valid Authorization Bearer token (Default: Empty (no auth required))
  urlPrefix:             ""                    # Add prefix to URL: example.com:5000/url-prefix/ (Default: /)
