{{/*
TLS secrets for the `ingress.tls` entries that carry an inline PEM certificate
and key, so a certificate can be handed to the chart directly instead of being
created out of band with `kubectl create secret tls`.

Only needed for an Ingress: a Route takes the PEM in its own spec, and an entry
that only names a `secretName` refers to a secret the chart does not own.
*/}}
{{- if and .Values.ingress.enabled (eq (include "libretranslate.ingressKind" .) "ingress") -}}
{{- range .Values.ingress.tls }}
{{- if and .certificate .privateKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "libretranslate.tlsSecretName" (dict "entry" . "root" $) }}
  labels:
    {{- include "libretranslate.labels" $ | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ printf "%s\n" (.certificate | trim) | b64enc }}
  tls.key: {{ printf "%s\n" (.privateKey | trim) | b64enc }}
  {{- if .caCertificate }}
  ca.crt: {{ printf "%s\n" (.caCertificate | trim) | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
